<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/Herdr Hud/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Ubuntu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Ubuntu Mono</family></prefer></alias>
</fontconfig>
